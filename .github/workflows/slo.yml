name: slo

# Hourly SLO check against the Worker's Analytics Engine metrics. A failed run is the alert:
# GitHub notifies on workflow failure (configure notifications or a status badge as you like).
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check SLOs (skipped when Cloudflare secrets are not configured)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/metrics-report.mjs --hours 1 | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
