name: release

# Publishes jev-lattice to npm with provenance. Trigger: push a tag vX.Y.Z (must match
# package.json), or run manually. Needs the repository secret NPM_TOKEN (an npm automation token).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - name: Skip if this version is already published
        id: check
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "jev-lattice@$v" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "jev-lattice@$v already published"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
