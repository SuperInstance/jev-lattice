name: JEV gates
description: Deterministic go/no-go gates over your repo's files, verified by TypeSafe Jev. Proofs on unchanged files are reused across runs.
branding:
  icon: check-circle
  color: green
inputs:
  config:
    description: Path to the gates config (see docs/guides/ci-gates.md)
    default: jev.gates.json
  root:
    description: Directory the config's `reads` paths are relative to
    default: "."
  state-path:
    description: Where the lattice state is kept between runs (restored/saved via actions/cache)
    default: .jev/state.json
  format:
    description: text | json | markdown (a markdown summary is always written to the job summary)
    default: text
  offline:
    description: "true = evaluate existing proofs only, no verifier calls"
    default: "false"
  model:
    description: Jev model to pin. Verdicts can change across model versions, so pin and upgrade deliberately.
    default: jev-1.13.0
  typesafe-token:
    description: TypeSafe API key (pass a secret). Not needed when offline is true.
    default: ""
outputs:
  pass:
    description: "true when every gate is GO"
    value: ${{ steps.gate.outputs.pass }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Restore lattice state
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.state-path }}
        key: jev-state-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          jev-state-${{ github.ref_name }}-
          jev-state-
    - name: Evaluate gates
      id: gate
      shell: bash
      env:
        JEV_MODEL: ${{ inputs.model }}
        TYPESAFE_AI_TOKEN: ${{ inputs.typesafe-token }}
      run: |
        set +e
        args=(gate --config "${{ inputs.config }}" --root "${{ inputs.root }}" --state "${{ inputs.state-path }}" --format "${{ inputs.format }}")
        if [ "${{ inputs.offline }}" = "true" ]; then args+=(--offline); fi
        node "${{ github.action_path }}/bin/jev.mjs" "${args[@]}"
        code=$?
        echo "pass=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # Re-raise the verifier's status so this STEP fails. `set +e` (above, needed to capture
        # $? and write the outputs) plus the trailing echo otherwise leaves the step exiting 0,
        # so steps.gate.outcome is `success` even when a gate is REFUTED -- and an outcome-based
        # gate can then never fire.
        exit $code
    - name: Save lattice state
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.state-path }}
        key: jev-state-${{ github.ref_name }}-${{ github.run_id }}
    # Keyed on the step's OUTCOME, not on an output string. A step that was skipped or cancelled
    # publishes no outputs, so `steps.gate.outputs.code` is null -- and null coerces to 0, which
    # made `!= '0'` false and waved a gate that never ran through as a pass.
    # always(): without a status function GitHub adds an implicit success(), which skips this step
    # exactly when the gate step failed, so the error annotation below would never be written.
    - name: Fail when gates are not GO
      if: always() && steps.gate.outcome != 'success'
      shell: bash
      run: |
        echo "::error::JEV gates are not all GO (outcome=${{ steps.gate.outcome }}, exit=${{ steps.gate.outputs.code }}); see the job summary"
        exit 1
